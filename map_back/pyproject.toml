[project]
name = "city-map-backend"
version = "0.2.0"
description = "Local Cesium layer catalog and file publishing service"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "python-multipart>=0.0.20",
  "shapely>=2.1,<3",
  "pyproj>=3.7,<4",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
